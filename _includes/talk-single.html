{% assign title = post.title %}

<div class="talk-row">
  <div class="talk-date">
    <time datetime="{{ post.date | date_to_xmlschema }}" itemprop="datePublished">
      {{ post.date | date: "%Y %b %d" }}
    </time>
  </div>
  <div class="talk-item" itemscope itemtype="https://schema.org/Event">
    <h3 class="talk-title" itemprop="name">
      <a href="{{ post.url | relative_url }}" rel="permalink" itemprop="url">{{ title }}</a>
    </h3>

    <div class="talk-meta">
        <div class="talk-venue" itemprop="location" itemscope itemtype="https://schema.org/Place">
          <span itemprop="name">
            {{ post.venue }}
          </span>
        </div>
        <div class="talk-location" itemprop="address">
          <i class="fa-solid fa-location-dot fa-fw pad-icon-right" aria-hidden="true"></i>
          {{ post.location }}
        </div>
        {% if post.link %}
          <div class="talk-link-single">
            <a href="{{ post.link }}" class="talk-link talk-link--details" target="_blank" rel="noopener">
              <i class="fa-solid fa-link fa-fw pad-icon-right" aria-hidden="true"></i>
              <span class="talk-link__text">URL</span>
            </a>
            {% if post.slidesurl %}
            <span class="talk-link__separator" aria-hidden="true">•</span>
              <a href="{{ post.slidesurl }}" class="talk-link talk-link--slides" target="_blank" rel="noopener">
                <i class="fa-solid fa-file-powerpoint fa-fw pad-icon-right" aria-hidden="true"></i>
                <span class="talk-link__text">Slides</span>
              </a>
          {% endif %}
          </div>
        {% endif %}
    </div>
  </div>
</div>
