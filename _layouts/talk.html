---
layout: default
---
<!-- Layout for page corresponding to individual talks -->
<div id="main" role="main" itemscope itemtype="https://schema.org/Event">
  <meta itemprop="name" content="{{ page.title }}">
  <meta itemprop="startDate" content="{{ page.date | date_to_xmlschema }}">
  <div class="page__inner-wrap">
    <div class="talk-meta-single">
        <div class="talk-type-single">{{ page.type }}</div>
        <div class="talk-venue-single" itemprop="location" itemscope itemtype="https://schema.org/Place">
          <span itemprop="name">{{ page.venue }}</span>
          <meta itemprop="address" content="{{ page.location }}">
        </div>
        <div class="talk-date-single">
          <i class="fa-graphite fa-thin fa-calendar fa-fw pad-icon-right" aria-hidden="true"></i>
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
        </div>
        <div class="talk-location-single">
          <i class="fa-slab-press fa-regular fa-location-dot fa-fw pad-icon-right" aria-hidden="true"></i>
          {{ page.location }}
        </div>
        {% if page.link %}
          <div class="talk-link-single">
            <i class="fa-sharp-duotone fa-regular fa-link fa-fw pad-icon-right" aria-hidden="true"></i>
            <a href="{{ page.link }}" class="talk-link talk-link--details" target="_blank" rel="noopener">
              <span class="talk-link__text">Link</span>
            </a>
          </div>
        {% endif %}
        {% if page.slidesurl %}
        <a href="{{ page.slidesurl }}" class="talk-link talk-link--slides" target="_blank" rel="noopener">
          <span class="talk-link__icon" aria-hidden="true">
            {% include icons/ppt.svg %}
          </span>
          <span class="talk-link__text">Slides</span>
        </a>
      {% endif %}
    </div>
    {% if content %}
    <section class="page__content" itemprop="text">
      {{ content }}
    </section>
    {% endif %}
  </div>
</div>
